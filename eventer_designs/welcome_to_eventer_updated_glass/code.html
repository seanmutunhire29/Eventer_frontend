<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        .glass-card {
            backdrop-filter: blur(52px);
            -webkit-backdrop-filter: blur(52px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
        }
        .glass-button {
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
        }
        .glass-overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: floating 4s ease-in-out infinite;
        }
        .active-dot {
            width: 24px;
            transition: all 0.3s ease;
        }
        .interaction-press:active {
            transform: scale(0.96);
            transition: transform 0.15s ease-out;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface-bright text-on-surface selection:bg-primary/20">
<!-- Background Canvas: Blurred Campus Map -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-bright/40 z-10"></div>
<div class="w-full h-full scale-110 filter blur-[4px] opacity-90" data-alt="An expansive, high-angle illustrative map of a prestigious university campus featuring lush green lawns, gothic stone architecture, and modern glass academic buildings. The lighting is soft morning sun, creating long, gentle shadows. The visual style is clean and architectural, utilizing a professional palette of Dartmouth Green, slate grays, and warm ivories. The overall mood is scholarly yet vibrant, suggesting an active community environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASh1hxf0rXa1j1LMXNBVNd1x7h9LNyRJsflSfwyoanSRFeVTY7x_p1PBHofiCNtiLEHtjIuxYyI8tCoWTFSbixbA0X4xkPoj4jFjEAiuXgnCDsSKH-A13o3BdOnQfsvydKvLV_YaQPwNNqajKEBMMNeAPe0ky4pC16OLdoJhwrCDON14kCsH3tpoDy_uMjVwQFDdSthcmJAe3Mqr66P8pqRtuurHkl9lV-wIABPBBlQHkFtt34QpRmkumrRtH9127ddzT5BdpqahI')">
</div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-20 w-full h-screen flex flex-col px-margin-mobile pt-16 pb-12 overflow-hidden">
<!-- Top Action Row -->
<div class="flex justify-end w-full">
<button class="glass-button font-label-bold text-label-bold text-primary px-5 py-2.5 rounded-full hover:bg-white/10 transition-colors uppercase tracking-widest interaction-press shadow-sm">
                Skip
            </button>
</div>
<!-- Centered Glass Onboarding Card -->
<div class="flex-1 flex items-center justify-center">
<div class="glass-card w-full max-w-sm rounded-[32px] p-stack-xl flex flex-col items-center text-center">
<!-- App Icon Container -->
<div class="w-24 h-24 bg-primary rounded-radius-glass flex items-center justify-center mb-stack-lg shadow-lg animate-float">
<span class="material-symbols-outlined text-on-primary text-[48px]" data-icon="event_note" style="font-variation-settings: 'FILL' 1;">
                        event_note
                    </span>
</div>
<!-- Messaging -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-stack-md leading-tight">
                    Welcome to Eventer
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4 leading-relaxed">
                    Your companion for never missing out on campus life.
                </p>
<!-- 3-Dot Progress Indicator -->
<div class="flex gap-2 mt-stack-xl">
<div class="h-1.5 active-dot rounded-full bg-primary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/20"></div>
</div>
</div>
</div>
<!-- Bottom Action CTA -->
<div class="w-full flex justify-center">
<button class="interaction-press w-full max-w-sm h-16 bg-primary text-on-primary rounded-full font-headline-sm-mobile text-headline-sm-mobile shadow-xl shadow-primary/30 flex items-center justify-center gap-2 hover:opacity-95 transition-opacity" onclick="window.location.reload()">
<span>Let's Go</span>
<span class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">
                    arrow_forward
                </span>
</button>
</div>
</main>
<!-- Optional Visual Atmospheric Effects -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-30 mix-blend-soft-light opacity-40">
<div class="absolute top-[10%] left-[-15%] w-[70%] h-[50%] bg-primary blur-[160px] rounded-full"></div>
<div class="absolute bottom-[5%] right-[-15%] w-[60%] h-[60%] bg-cat-social blur-[140px] rounded-full"></div>
</div>
<script>
        // Simple Interaction logic for button ripple or feedback
        document.querySelectorAll('.interaction-press').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('touchend', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 60;
            const moveY = (e.clientY - window.innerHeight / 2) / 60;
            const bg = document.querySelector('.fixed.inset-0.z-0 div[data-alt]');
            if(bg) bg.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
